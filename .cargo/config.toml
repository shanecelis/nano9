[target.armv7-unknown-linux-gnueabihf]
# linker = "arm-linux-gnueabihf-gcc"
linker = "arm-none-eabi-ld"
# Optional: specify the archiver
# ar = "arm-linux-gnueabihf-ar"
#
[alias]
n9 = "run"
test-golden = "test --test golden -- --nocapture --test-threads=1"
test-sfx = "test --test sfx -- --nocapture --test-threads=1"
bench-raster = "bench --bench raster --"

# Bevy + luars on wasm: getrandom 0.3 needs an explicit JS backend, and BMS
# Lua pcall + host functions overflow the default ~1MB wasm stack.
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg", "getrandom_backend=\"wasm_js\"",
    "-C", "link-arg=-zstack-size=16777216",
]


