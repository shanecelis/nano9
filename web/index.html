<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nano-9 web cart</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* CSS scales the display only. The GPU swapchain stays at Bevy's
         window resolution (default 512²) so WebGL2's 2048 limit is not hit. */
      #nano9-canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: min(100vmin, 100%);
        height: min(100vmin, 100%);
        outline: none;
      }
    </style>
    <!--
      Pick a cart with ?cart= (path under assets/). Examples:
        /?cart=pset.lua
        /?cart=golden/spr.p8
        /?cart=celeste.p8.png&shared-data=map
      Drop or symlink files into ../assets (or ../tests/golden).
      16MB wasm stack is set in .cargo/config.toml
      (`-C link-arg=-zstack-size=16777216`). Asset `.meta` files are skipped
      via AssetMetaCheck::Never on wasm.
    -->
    <link
      data-trunk
      rel="rust"
      href="../Cargo.toml"
      data-bin="web_cart"
      data-cargo-features="web"
      data-cargo-no-default-features
      data-wasm-opt="0"
    />
    <link data-trunk rel="copy-dir" href="../assets" data-target-path="assets" />
    <link data-trunk rel="copy-dir" href="../tests/golden" data-target-path="assets/golden" />
  </head>
  <body>
    <canvas id="nano9-canvas" tabindex="0"></canvas>
  </body>
</html>
