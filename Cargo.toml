[package]
name = "nano9"
description = "A Pico-8 compatibility layer for Bevy"
authors = ["Shane Celis <shane.celis@gmail.com>"]
version = "0.1.0-alpha.5"
edition = "2024"
keywords = [
    "bevy",
    "gamedev",
    "pico-8",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanecelis/nano-9"
exclude = [
    "assets/*.glb",
    "potato",
]

[dependencies]
bevy = { version = "0.17", features = [ "bevy_dev_tools", "asset_processor" ] }
bevy_mod_scripting = { version = "0.17.0", features = ["lua54", "core_functions"], default-features = false, optional = true }
bytemuck = "1.16.3"
thiserror = "1.0.63"
bevy_minibuffer = { version = "0.4.1", optional = true }
bevy_minibuffer_inspector = { version = "0.2.0", optional = true }
bevy_egui = { version = "0.37.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
bevy_ecs_tilemap = "0.17.0"
keyseq = { version = "0.6.0", features = ["bevy"], optional = true }
dasp = { version = "0.11.0", features = ["all"] }
bresenham = "0.1.1"
rand = { version = "0.9.2", optional = true }
tiny-skia = "0.11.4"
toml = "0.8.19"
# ldtk_rust = { version = "0.6.1", optional = true }
serde_json = { version = "1.0", optional = true }
bevy_ecs_tiled = { version = "0.10.0", optional = true }
tiled = { version = "0.15.0", optional = true }
bitflags = "2.8.0"
bitvec = "1.0.1"
futures-lite = { version = "2.6.0", optional = true }
bevy_rand = { version = "0.12.0", features = ["wyrand"], optional = true }
bevy_prng = { version = "0.12.0", optional = true }
pico8_decompress = { version = "0.1.0" }
png = "0.17.16"
pico8-to-lua = { version = "0.1.1", optional = true }
fixed = { version = "1.29.0", optional = true }
bevy_web_asset = { version = "0.11.0", optional = true, default-features = false }
mashmap = "0.2.2"
clap = { version = "4.5.39", features = ["derive"], optional = true }
cmd_lib = { version = "1.9.5", optional = true }
log = { version = "0.4.27", optional = true }
env_logger = { version = "0.11.8", optional = true }
merge2 = "0.3.2"
bevy_framepace = { version = "0.20.1", optional = true }
bevy_vox_scene = "0.20.0"
bevy_mod_debugdump = { version = "0.14.0", optional = true }
num-traits = "0.2.19"
bevy_window_sdl2_backend = { version = "0.1.0", optional = true, git = "https://github.com/IceSentry/bevy_window_sdl2_backend.git"}
# Force spin_sleep to 1.3.3 to resolve conflict between bevy_window_sdl2_backend and bevy_framepace
spin_sleep = "1.3.3"
[features]
default = [ "cli", "level" ]
sdl = [ "dep:bevy_window_sdl2_backend" ]
cli = [ "lua-lib", "dep:clap", "dep:cmd_lib", "gameboy", "dep:log", "dep:env_logger", "dep:cmd_lib" ]
lua-lib = [ "rust-lib", "pico8-to-lua", "scripting", "rand", "framepace" ]
rust-lib = [ "negate-y", "fixed-point", "pixel-snap", "rand", "framepace" ]
negate-y = []
inspector = [ "minibuffer", "dep:bevy_minibuffer_inspector", "dep:bevy_egui" ]
minibuffer = [ "dep:bevy_minibuffer", "dep:keyseq" ]
debugdump = [ "dep:bevy_mod_debugdump" ]
pico8-to-lua = [ "dep:pico8-to-lua" ]
fixed-point = [ "dep:fixed" ]
scripting = [ "dep:bevy_mod_scripting" ]
web-asset = [ "dep:bevy_web_asset" ]
watcher = [ "bevy/file_watcher" ]
framepace = [ "dep:bevy_framepace" ]
pixel-snap = []
gameboy = []
tiled = [ "dep:tiled" ]
mute = []
rand = [ "dep:rand", "dep:bevy_rand", "dep:bevy_prng" ]
# Features after this line are not supported yet.
# -----------------------------------------------
# level = [ "dep:bevy_ecs_ldtk", "dep:ldtk_rust", "dep:serde_json"]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json", "bevy_ecs_tiled/user_properties" ]
user_properties = [ "bevy_ecs_tiled/user_properties" ]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json" ]
level = [ "dep:bevy_ecs_tiled", "dep:serde_json", "dep:futures-lite", "tiled", "scripting" ]


[dev-dependencies]
bevy = "0.17"
version-sync = "0.9.5"

[[bin]]
name = "n9"
test = false
bench = false
required-features = [ "cli" ]

