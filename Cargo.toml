[workspace]
members = ["."]
resolver = "2"

[package]
name = "nano9"
description = "A Pico-8 compatibility layer for Bevy"
authors = ["Shane Celis <shane.celis@gmail.com>"]
version = "0.1.0-alpha.8"
edition = "2024"
keywords = [
    "bevy",
    "gamedev",
    "pico-8",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanecelis/nano9"
exclude = [
    "assets/*.glb",
    "potato",
]
default-run = "n9"

[dependencies]
# Local ../bevy is 0.20.0-dev. [patch.crates-io] only replaces that exact
# version, so this must not stay on 0.20.0-rc.1 or the patches are unused.
bevy = { version = "0.20.0-dev", features = [ "bevy_dev_tools", "asset_processor", "serialize", "audio" ] }
# BMS without lua54/mlua: Lua is provided by bevy_mod_scripting_luars (luars 0.26.2).
bevy_mod_scripting = { version = "0.21", features = ["core_functions"], default-features = false, optional = true }
bevy_mod_scripting_luars = { version = "0.1", optional = true }
bytemuck = "1.16.3"
thiserror = "1.0.63"
bevy_minibuffer = { version = "0.8", optional = true }
bevy_minibuffer_inspector = { version = "0.6", optional = true }
bevy_egui = { version = "0.42", optional = true }
keyseq = { version = "0.10.0", features = ["bevy"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
bevy_ecs_tilemap = { version = "0.19", optional = true }
dasp = { version = "0.11.0", features = ["all"] }
nano9_raster = { version = "0.1.0", features = ["circle", "ellipse", "fill", "inclusive", "round-rect"] }
rand = { version = "0.10", optional = true }
rand_core = "0.10"
toml = "0.8.19"
# ldtk_rust = { version = "0.6.1", optional = true }
serde_json = { version = "1.0", optional = true }
bevy_ecs_tiled = { version = "0.13", optional = true }
tiled = { version = "0.16.0", optional = true }
bitflags = "2.9"
bitvec = "1.0.1"
futures-lite = { version = "2.6.0", optional = true }
bevy_rand = { version = "0.16", features = ["wyrand"], optional = true }
bevy_prng = { version = "0.16", optional = true }
pico8_decompress = { version = "0.1.0" }
png = "0.17.16"
pico8-to-lua = { version = "0.1.1", optional = true }
fixed = { version = "1.29.0", optional = true }
mashmap = "0.2.2"
clap = { version = "4.5.39", features = ["derive"], optional = true }
log = { version = "0.4.27", optional = true }
env_logger = { version = "0.11.8", optional = true }
merge2 = "0.3.2"
bevy_framepace = { version = "0.22", optional = true }
bevy_vox_scene = { version = "0.22", optional = true }
bevy_mod_debugdump = { version = "0.16", optional = true }
num-traits = "0.2.19"
bobtail = { version = "0.3.0", features = [ "omit-token" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "UrlSearchParams"] }

[features]
default = [ "cli", "watcher", "web-asset" ]
cli = [ "lua-lib", "dep:clap", "gameboy", "dep:log", "dep:env_logger" ]
lua-lib = [ "rust-lib", "pico8-to-lua", "scripting", "rand", "framepace", "vox" ]
lua-lib-wasm = [ "fixed-point", "rand", "pico8-to-lua", "scripting" ]
rust-lib = [ "fixed-point", "rand", "framepace", "vox" ]
inspector = [ "minibuffer", "dep:bevy_minibuffer_inspector", "dep:bevy_egui" ]
minibuffer = [ "dep:bevy_minibuffer", "dep:keyseq", "bevy/render_dev_tools" ]
debugdump = [ "dep:bevy_mod_debugdump" ]
pico8-to-lua = [ "dep:pico8-to-lua" ]
fixed-point = [ "dep:fixed" ]
scripting = [ "dep:bevy_mod_scripting", "dep:bevy_mod_scripting_luars" ]
web-asset = [ "bevy/http", "bevy/https" ]
watcher = [ "bevy/file_watcher" ]
framepace = [ "dep:bevy_framepace" ]
# cpu-render = []
gameboy = []
tiled = [ "dep:tiled" ]
rand = [ "dep:rand", "dep:bevy_rand", "dep:bevy_prng" ]
vox = [ "dep:bevy_vox_scene" ]
# Features after this line are not supported yet.
# -----------------------------------------------
# level = [ "dep:bevy_ecs_ldtk", "dep:ldtk_rust", "dep:serde_json"]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json", "bevy_ecs_tiled/user_properties" ]
user_properties = [ "bevy_ecs_tiled/user_properties" ]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json" ]
level = [ "dep:bevy_ecs_tiled", "dep:bevy_ecs_tilemap", "dep:serde_json", "dep:futures-lite", "tiled", "scripting" ]
web = [ "lua-lib-wasm" ]
dev-tools = []


[dev-dependencies]
bevy = "0.20.0-dev"
version-sync = "0.9.5"
png = "0.17.16"
lewton = "0.10"
vorbis_rs = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[test]]
name = "golden"
harness = false

[[test]]
name = "sfx"
path = "tests/sfx.rs"
harness = false

[[bench]]
name = "raster"
harness = false

[[bin]]
name = "web_cart"
test = false
bench = false
required-features = ["web"]
path = "src/bin/web_cart.rs"

[[bin]]
name = "n9"
test = false
bench = false
required-features = [ "cli" ]

[[bin]]
name = "export-config"
test = false
bench = false
required-features = [ "dev-tools" ]

