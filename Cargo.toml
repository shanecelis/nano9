[package]
name = "nano9"
description = "A Pico-8 compatibility layer for Bevy"
authors = ["Shane Celis <shane.celis@gmail.com>"]
version = "0.1.0-alpha.2"
edition = "2021"
keywords = [
    "bevy",
    "gamedev",
    "pico-8",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanecelis/nano-9"

[dependencies]
bevy = { version = "0.15", features = [ "bevy_dev_tools", "asset_processor" ] }
bevy_mod_scripting = { version = "0.12", features = ["lua54", "core_functions"], default-features = false, optional = true }
bytemuck = "1.16.3"
thiserror = "1.0.63"
bevy_minibuffer = { version = "0.3.0", optional = true }
bevy_minibuffer_inspector = { version = "0.1.0", optional = true }
serde = { version = "1.0.217", features = ["derive"] }
bevy_ecs_tilemap = "0.15.0"
keyseq = { version = "0.5.0", features = ["bevy"] }
dasp = { version = "0.11.0", features = ["all"] }
bresenham = "0.1.1"
rand = "0.8.5"
tiny-skia = "0.11.4"
toml = "0.8.19"
atomicow = "1.0.0"
# ldtk_rust = { version = "0.6.1", optional = true }
serde_json = { version = "1.0", optional = true }
bevy_ecs_tiled = { version = "0.6", optional = true }
bitflags = "2.8.0"
tiled = "0.14.0"
bitvec = "1.0.1"
futures-lite = { version = "2.6.0", optional = true }
bevy_rand = { version = "0.9.0", features = ["wyrand"] }
bevy_prng = "0.9.0"
pico8_decompress = { version = "0.1.0" }
png = "0.17.16"
pico8-to-lua = { version = "0.1.0", optional = true }
fixed = { version = "1.29.0", optional = true }
bevy_web_asset = { version = "0.10.0", optional = true, default-features = false }
mashmap = "0.2.1"
clap = { version = "4.5.39", features = ["derive"], optional = true }
cargo-generate = { version = "0.23.3", optional = true }

[features]
default = [ "negate-y", "pico8-to-lua", "fixed", "scripting", "pixel-snap" ]
negate-y = []
inspector = [ "minibuffer", "dep:bevy_minibuffer_inspector" ]
minibuffer = [ "dep:bevy_minibuffer" ]
pico8-to-lua = [ "dep:pico8-to-lua" ]
fixed = [ "dep:fixed" ]
scripting = [ "dep:bevy_mod_scripting" ]
web-asset = [ "dep:bevy_web_asset" ]
pixel-snap = []
# Features after this line are not supported yet.
# -----------------------------------------------
# level = [ "dep:bevy_ecs_ldtk", "dep:ldtk_rust", "dep:serde_json"]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json", "bevy_ecs_tiled/user_properties" ]
user_properties = [ "bevy_ecs_tiled/user_properties" ]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json" ]
level = [ "dep:bevy_ecs_tiled", "dep:serde_json", "dep:futures-lite" ]
clap = ["dep:clap"]
cargo-generate = ["dep:cargo-generate"]

[dev-dependencies]
bevy = "0.15"
version-sync = "0.9.5"

[[bin]]
name = "n9"
test = false
bench = false
required-features = [ "scripting", "clap" ]

[patch.crates-io]
mashmap = { git = "https://github.com/shanecelis/mashmap.git", branch = "drain_key_if" }
