[workspace]
members = ["."]
resolver = "2"

[package]
name = "nano9"
description = "A Pico-8 compatibility layer for Bevy"
authors = ["Shane Celis <shane.celis@gmail.com>"]
version = "0.1.0-alpha.7"
edition = "2024"
keywords = [
    "bevy",
    "gamedev",
    "pico-8",
]
categories = [
    "game-development"
]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shanecelis/nano9"
exclude = [
    "assets/*.glb",
    "potato",
]
default-run = "n9"

[dependencies]
bevy = { version = "0.19.1", features = [ "bevy_dev_tools", "asset_processor", "serialize", "audio" ] }
# BMS without lua54/mlua: Lua is provided by bevy_mod_scripting_luars (luars 0.26.2).
bevy_mod_scripting = { version = "0.21", features = ["core_functions"], default-features = false, optional = true }
bevy_mod_scripting_luars = { version = "0.1", optional = true }
bytemuck = "1.16.3"
thiserror = "1.0.63"
bevy_minibuffer = { version = "0.7", optional = true }
bevy_minibuffer_inspector = { version = "0.5", optional = true }
bevy_egui = { version = "0.40", optional = true }
keyseq = { version = "0.9.0", features = ["bevy"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
bevy_ecs_tilemap = "0.19"
dasp = { version = "0.11.0", features = ["all"] }
nano9_raster = { path = "../nano9_raster", features = ["circle", "ellipse", "fill", "inclusive"] }
rand = { version = "0.10", optional = true }
rand_core = "0.10"
toml = "0.8.19"
# ldtk_rust = { version = "0.6.1", optional = true }
serde_json = { version = "1.0", optional = true }
bevy_ecs_tiled = { version = "0.13", optional = true }
tiled = { version = "0.15.0", optional = true }
bitflags = "2.9"
bitvec = "1.0.1"
futures-lite = { version = "2.6.0", optional = true }
bevy_rand = { version = "0.15", features = ["wyrand"], optional = true }
bevy_prng = { version = "0.15", optional = true }
pico8_decompress = { version = "0.1.0" }
png = "0.17.16"
pico8-to-lua = { version = "0.1.1", optional = true }
fixed = { version = "1.29.0", optional = true }
mashmap = "0.2.2"
clap = { version = "4.5.39", features = ["derive"], optional = true }
log = { version = "0.4.27", optional = true }
env_logger = { version = "0.11.8", optional = true }
merge2 = "0.3.2"
bevy_framepace = { version = "0.21", optional = true }
bevy_vox_scene = { version = "0.22", optional = true }
bevy_mod_debugdump = { version = "0.15", optional = true }
num-traits = "0.2.19"
bobtail = { version = "0.3.0", features = [ "omit-token" ] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Url", "UrlSearchParams"] }

[features]
default = [ "cli", "watcher", "web-asset" ]
cli = [ "lua-lib", "dep:clap", "gameboy", "dep:log", "dep:env_logger" ]
lua-lib = [ "rust-lib", "pico8-to-lua", "scripting", "rand", "framepace", "vox" ]
lua-lib-wasm = [ "fixed-point", "rand", "pico8-to-lua", "scripting" ]
rust-lib = [ "fixed-point", "rand", "framepace", "vox" ]
inspector = [ "minibuffer", "dep:bevy_minibuffer_inspector", "dep:bevy_egui" ]
minibuffer = [ "dep:bevy_minibuffer", "dep:keyseq" ]
debugdump = [ "dep:bevy_mod_debugdump" ]
pico8-to-lua = [ "dep:pico8-to-lua" ]
fixed-point = [ "dep:fixed" ]
scripting = [ "dep:bevy_mod_scripting", "dep:bevy_mod_scripting_luars" ]
web-asset = [ "bevy/http", "bevy/https" ]
watcher = [ "bevy/file_watcher" ]
framepace = [ "dep:bevy_framepace" ]
# cpu-render = []
gameboy = []
tiled = [ "dep:tiled" ]
rand = [ "dep:rand", "dep:bevy_rand", "dep:bevy_prng" ]
vox = [ "dep:bevy_vox_scene" ]
# Features after this line are not supported yet.
# -----------------------------------------------
# level = [ "dep:bevy_ecs_ldtk", "dep:ldtk_rust", "dep:serde_json"]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json", "bevy_ecs_tiled/user_properties" ]
user_properties = [ "bevy_ecs_tiled/user_properties" ]
# level = [ "dep:bevy_ecs_tiled", "dep:serde_json" ]
level = [ "dep:bevy_ecs_tiled", "dep:serde_json", "dep:futures-lite", "tiled", "scripting" ]
web = [ "lua-lib-wasm" ]
dev-tools = []


[dev-dependencies]
bevy = "0.19"
version-sync = "0.9.5"
png = "0.17.16"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"

[[test]]
name = "golden"
harness = false

[[bench]]
name = "raster"
harness = false

[[bin]]
name = "web_cart"
test = false
bench = false
required-features = ["web"]
path = "src/bin/web_cart.rs"

[[bin]]
name = "n9"
test = false
bench = false
required-features = [ "cli" ]

[[bin]]
name = "export-config"
test = false
bench = false
required-features = [ "dev-tools" ]

[patch.crates-io]
# bobtail = { path = "../bobtail" }
bevy_minibuffer = { path = "../bevy_minibuffer" }
bevy_minibuffer_inspector = { path = "../bevy_minibuffer_inspector" }
bevy_framepace = { git = "https://github.com/hacknus/bevy_framepace.git", branch = "bevy_0.19" }
bevy_vox_scene = { git = "https://github.com/oliver-dew/bevy_vox_scene.git", branch = "feature/bevy-0.19" }
bevy_mod_debugdump = { git = "https://github.com/jakobhellermann/bevy_mod_debugdump.git", branch = "bevy-main" }
bevy_asky = { path = "../bevy_asky" }
bevy-input-sequence = { path = "../bevy-input-sequence" }
keyseq = { path = "../keyseq" }
